name: Release Tests

on:
  pull_request:

permissions:
  contents: read

env:
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  publish-npm:
    name: Dry-run npm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Node.js
        uses: tanaabased/actions/setup-node@v1
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run test
      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          version: ${{ env.STAMPED_VERSION }}
          release-date: ${{ github.event.pull_request.created_at }}
          release-url: ${{ github.event.pull_request.html_url }}
          commands: |
            version-injector tanaboot.sh --style sh --version "$PREPARE_RELEASE_VERSION"
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run format:check
      - name: Pack plugin
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Check extracted package
        id: package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball-path }}
        run: |
          package_root="$(mktemp -d "$RUNNER_TEMP/tanaabot-package.XXXXXX")"
          tar -xzf "$TARBALL" -C "$package_root" --strip-components=1
          echo "path=$package_root" >> "$GITHUB_OUTPUT"
          bun run check:package "$package_root"
      - name: Validate packed Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
        with:
          plugin-directory: ${{ steps.package.outputs.path }}
      - name: Dry-run npm publication
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          dry-run: true

  publish-clawhub:
    name: Dry-run ClawHub
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Node.js
        uses: tanaabased/actions/setup-node@v1
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run test
      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          version: ${{ env.STAMPED_VERSION }}
          release-date: ${{ github.event.pull_request.created_at }}
          release-url: ${{ github.event.pull_request.html_url }}
          commands: |
            version-injector tanaboot.sh --style sh --version "$PREPARE_RELEASE_VERSION"
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run format:check
      - name: Pack plugin
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Check extracted package
        id: package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball-path }}
        run: |
          package_root="$(mktemp -d "$RUNNER_TEMP/tanaabot-package.XXXXXX")"
          tar -xzf "$TARBALL" -C "$package_root" --strip-components=1
          echo "path=$package_root" >> "$GITHUB_OUTPUT"
          bun run check:package "$package_root"
      - name: Validate packed Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
        with:
          plugin-directory: ${{ steps.package.outputs.path }}
      - name: Dry-run ClawHub publication
        uses: tanaabased/actions/publish-clawhub@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          owner: tanaab
          tags: edge
          source-commit: ${{ github.event.pull_request.head.sha }}
          dry-run: true

  publish-repo:
    name: Dry-run repo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Node.js
        uses: tanaabased/actions/setup-node@v1
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run test
      - name: Validate Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
      - name: Publish repo
        uses: tanaabased/actions/publish-repo@v1
        with:
          dry-run: true
          version: ${{ env.STAMPED_VERSION }}
          release-date: ${{ github.event.pull_request.created_at }}
          release-url: ${{ github.event.pull_request.html_url }}
          commands: |
            version-injector tanaboot.sh --style sh --version "$PREPARE_RELEASE_VERSION"
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run format:check
      - name: Check prepared package
        run: bun run check:package .
