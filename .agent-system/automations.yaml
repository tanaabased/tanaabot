defaults: &defaults
  group: REPORTS
  runtimes: [codex]

automations:
  - <<: *defaults
    id: cloud-update
    thread: CLOUD UPDATE
    schedule: '0 1 * * *'
    prompt:
      file: ../prompts/cloud-update.md

  - <<: *defaults
    id: automation-sync
    group: TANAABOT
    thread: AUTOMATION SYNC
    schedule: '0 0 * * *'
    prompt:
      file: ../prompts/automation-sync.md
  - <<: *defaults
    id: instruction-sync
    group: TANAABOT
    thread: INSTRUCTION SYNC
    schedule: '0 1 * * *'
    prompt:
      file: ../prompts/instruction-sync.md
