# Shared Tanaabot defaults: Cloud tanaabot, reusable chats named from display-name, REPORTS.
# Native schedule names and linked main-chat summaries are assembled by automation-sync.
- id: sync
  display-name: AUTOMATION SYNC
  enabled: false
  runtimes: [codex]
  schedule: '0 0 * * *'
  prompt:
    file: ../prompts/automations/sync.md
- id: smoke-test
  display-name: SMOKE TEST
  enabled: false
  runtimes: [codex]
  schedule: '15 0 * * *'
  prompt:
    file: ../prompts/automations/smoke-test.md
- id: smoke-test-canary
  display-name: SMOKE TEST CANARY
  enabled: true
  runtimes: [codex]
  schedule: '*/10 * * * *'
  prompt:
    file: ../prompts/automations/smoke-test-canary.md
