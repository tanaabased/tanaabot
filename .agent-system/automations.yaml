# Shared Tanaabot defaults: Cloud tanaabot, reusable chats named from display-name, REPORTS.
# Native schedule names and linked main-chat summaries are assembled by automation-sync.
- id: sync
  display-name: AUTOMATION SYNC
  enabled: true
  runtimes: [codex]
  schedule:
    cron: '0 0 * * *'
    timezone: America/New_York
  prompt:
    file: ../prompts/automations/sync.md
- id: update-cloud-canon
  display-name: UPDATE CLOUD CANON
  enabled: true
  runtimes: [codex]
  schedule:
    cron: '0 1 * * *'
    timezone: America/New_York
  prompt:
    file: ../prompts/automations/update-cloud-canon.md
