# Shared Tanaabot defaults: Cloud tanaabot, reusable chats named from display-name, REPORTS.
# Native schedule names and linked main-chat summaries are assembled by automation-sync.
- id: sync
  display-name: AUTOMATION SYNC
  enabled: true
  runtimes: [codex]
  schedule:
    cron: '0 0 * * *'
    timezone: America/New_York
  prompt:
    file: ../prompts/automations/sync.md
- id: smoke-test-canary-3
  display-name: 'SMOKE TEST CANARY #3'
  enabled: true
  runtimes: [codex]
  schedule:
    # Inert until cleanup and seeding are ready; publish the operator's pilot time then.
    at: '2000-01-01T00:00:00Z'
  prompt:
    file: ../prompts/automations/smoke-test-canary-3.md
