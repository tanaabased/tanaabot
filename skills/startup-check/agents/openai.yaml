interface:
  display_name: 'Tanaabot Startup Check'
  short_description: 'Verify Cloud tools, dotfiles and skill discovery without repairs'
  icon_small: './assets/composer-icon.svg'
  icon_large: './assets/icon-large.png'
  brand_color: '#00ebfd'
  default_prompt: 'Use $tanaabot-startup-check to verify this prepared Tanaabot Cloud environment and report one five-section status card, with details only for failed or unverified checks. Do not change the environment.'
policy:
  allow_implicit_invocation: true
