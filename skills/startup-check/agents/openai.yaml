interface:
  display_name: 'Tanaabot Startup Check'
  short_description: 'Check Cloud readiness and load local Tanaabot skill metadata'
  icon_small: './assets/composer-icon.svg'
  icon_large: './assets/icon-large.png'
  brand_color: '#00ebfd'
  default_prompt: 'Use $tanaabot-startup-check to verify this prepared Cloud environment, explicitly load local Tanaabot skill metadata, and check Canon catalog availability. Keep the six status rows together. Below them, include Notes only when needed, ordered ❌ errors, ⚠️ warnings, then ℹ️ information. Follow the startup report contract for the optional status report. Do not change files or settings or register skills.'
policy:
  allow_implicit_invocation: true
